<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarcoMaster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
<!-- PWA: installable manifest + platform metadata (subpath: /MarcoMaster/) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MarcoMaster">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=46">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">
      <h1><span class="dot"></span>MarcoMaster</h1>
    </div>
    <div id="navLinks"></div>
    <div class="side-foot">
      <button class="reset-btn" id="resetBtn">⟲ Reset Button</button>
      <button class="theme-btn" id="themeBtn" title="toggle light / dark">◑</button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast">Saved</div>
<div class="modal-bg" id="resetModal"></div>
<!-- Fire Station: persistent bar + full-screen takeover, both OUTSIDE .app so no
     page render disturbs them and the clock survives navigation. -->
<div class="fire-bar" id="fireBar"></div>
<div class="fire-screen" id="fireScreen"></div>

<!-- Firebase SDK (cloud auth + sync) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>

<!-- App scripts: classic (non-module) scripts sharing one global scope.
     Load order matters — app.js runs init() last, after every definition. -->
<script src="js/storage.js?v=18"></script>
<script src="js/defaults.js?v=7"></script>
<script src="js/state.js?v=37"></script>
<script src="js/tasks.js?v=11"></script>
<script src="js/recurring.js?v=8"></script>
<script src="js/page-today.js?v=34"></script>
<script src="js/page-recurring.js?v=7"></script>
<script src="js/page-review-scorecard.js?v=7"></script>
<script src="js/page-board.js?v=8"></script>
<script src="js/page-shutdown.js?v=7"></script>
<script src="js/page-plan.js?v=8"></script>
<script src="js/page-insights.js?v=8"></script>
<script src="js/page-settings.js?v=16"></script>
<script src="js/page-projects.js?v=14"></script>
<script src="js/page-meetings.js?v=6"></script>
<script src="js/page-followups.js?v=9"></script>
<script src="js/page-appointments.js?v=20"></script>
<script src="js/page-journal.js?v=10"></script>
<script src="js/page-fsn.js?v=1"></script>
<script src="js/page-fire.js?v=2"></script>
<script src="js/page-leaks.js?v=3"></script>
<script src="js/push.js?v=3"></script>
<script src="js/ui-core.js?v=20"></script>
<script src="js/app.js?v=21"></script>
</body>
</html>
